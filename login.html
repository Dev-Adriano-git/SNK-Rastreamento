<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a1220">
    <link rel="manifest" href="manifest.json">
    <title>Entrar | SNK Rastreamento</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth">
        <section class="auth-form">
            <form class="auth-box" id="f"><img class="logo" src="assets/logo.png" alt="SNK Rastreamento">
                <h1>Acesse sua conta</h1>
                <p class="sub">Entre para acompanhar seus veículos.</p>
                <div class="field"><label for="u">E-mail</label><input id="u" type="email" autocomplete="username"
                        required></div>
                <div class="field"><label for="s">Senha</label><input id="s" type="password"
                        autocomplete="current-password" required></div>
                <div class="err" id="e"></div><button class="btn btn-primary">Entrar</button>
                <p class="foot">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>

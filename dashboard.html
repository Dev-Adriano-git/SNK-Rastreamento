<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a1220">
    <link rel="manifest" href="manifest.json">
    <title>Painel | SNK Rastreamento</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <aside id="side">
        <div class="top"><span class="logo-chip"><img src="assets/logo.png" alt="SNK"></span><button
                onclick="sessao.sair()">Sair</button></div>
        <div class="sum">
            <div><b id="n1">0</b>Em movimento</div>
            <div><b id="n2">0</b>Parados</div>
            <div><b id="n3">0</b>Offline</div>
        </div>
        <div class="q"><input id="busca" placeholder="Buscar placa ou modelo" oninput="lista()"></div>
        <div id="lista"></div>
        <div class="adm" id="adm" style="display:none"><a class="btn" href="admin.html"
                style="grid-column:1/-1;text-align:center">Área do administrador</a></div>
    </aside>
    <main><button class="btn" id="menu" onclick="side.classList.toggle('open')">☰ Veículos</button>
        <div id="map"></div>
        <div class="tools" id="tools"><button class="btn" onclick="camada(this)">Satélite</button><button class="btn"
                onclick="alternarDemo(this)">Demonstração</button><button class="btn" id="bseg"
                onclick="alternarSeguir()">Seguindo: sim</button><button class="btn" onclick="cerca()">Cerca
                virtual</button><button class="btn" onclick="rota()">Histórico</button><button class="btn"
                onclick="pdf()">Relatório PDF</button></div>
        <div id="det"></div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/live.js"></script>
</body>

</html>

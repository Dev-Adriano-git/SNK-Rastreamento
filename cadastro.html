<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a1220">
    <title>Criar conta | SNK Rastreamento</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth">
        <section class="auth-form">
            <form class="auth-box" id="f"><img class="logo" src="assets/logo.png" alt="SNK Rastreamento">
                <h1>Criar conta</h1>
                <p class="sub">Preencha seus dados para começar.</p>
                <div class="row">
                    <div class="field"><label for="nome">Nome completo</label><input id="nome" required></div>
                    <div class="field"><label for="tel">WhatsApp</label><input id="tel" inputmode="numeric"
                            placeholder="(11) 99999-9999" required></div>
                </div>
                <div class="field"><label for="email">E-mail</label><input id="email" type="email" required></div>
                <div class="row">
                    <div class="field"><label for="senha">Senha (mín. 8 caracteres)</label><input id="senha"
                            type="password" minlength="8" required></div>
                    <div class="field"><label for="conf">Confirmar senha</label><input id="conf" type="password"
                            required></div>
                </div>
                <div class="err" id="e"></div><button class="btn btn-primary">Criar conta</button>
                <p class="foot">Já tem conta? <a href="login.html">Entrar</a></p>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
